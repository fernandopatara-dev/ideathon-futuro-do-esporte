<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telão — Ideathon Futuro do Esporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
body{background:linear-gradient(160deg,#1b2657,var(--stage) 55%,#1c2f4a);color:var(--stage-ink);overflow:hidden}
.stage{height:100vh;height:100dvh;display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto auto 1fr;gap:14px 20px;padding:20px 24px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px 26px;flex-wrap:nowrap;border-bottom:1px solid var(--stage-line);padding-bottom:12px}
.top h1{font-size:34px;white-space:nowrap;flex:0 1 auto;min-width:0}.top h1 .em{color:var(--yellow)}
.live{display:inline-flex;align-items:center;gap:11px;margin-left:auto;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.18em;color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,77,94,.6);padding:9px 24px;border-radius:999px}
.live i{width:14px;height:14px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 12px #ff4d5e;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kpi{display:flex;gap:46px;margin-left:auto;align-items:flex-start;padding-left:20px;flex:none}
.kpi div{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--stage-muted);text-align:center;white-space:nowrap}
.kpi b{display:block;font-family:var(--display);font-weight:700;font-size:38px;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums;margin-top:8px}
.ticker{grid-column:1/-1;background:rgba(244,177,28,.10);border:1px solid var(--stage-line);border-left:4px solid var(--yellow);padding:9px 16px;border-radius:9px;display:flex;gap:16px;align-items:center;overflow:hidden}
.ticker .lab{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--yellow);flex:none;padding-right:16px;border-right:1px solid rgba(244,177,28,.4)}
.ticker .txt{font-family:var(--display);font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .who{font-family:var(--mono);font-size:11px;color:var(--stage-muted);flex:none;margin-left:auto;text-align:right}
.mapwrap{position:relative;min-height:0}
.cloud{position:absolute;top:0;right:0;bottom:40px;left:0;overflow:hidden;transition:opacity .35s ease}
.cloud.flow{display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:12px 40px;padding:10px 20px}
.ideaword{font-family:var(--display);font-weight:800;line-height:1.1;text-align:center;max-width:44%;white-space:normal;text-shadow:0 0 26px currentColor,0 0 9px rgba(0,0,0,.25)}
.ideaword .n{display:block;font-size:.34em;font-weight:700;font-family:var(--mono);opacity:.55;color:var(--stage-muted);margin-top:4px;letter-spacing:.05em}
.cloudword{position:absolute;transform:translate(-50%,-50%);max-width:250px;white-space:normal;text-align:center;font-family:var(--display);font-weight:700;line-height:1.05;padding:0;background:none;transition:opacity .4s ease}
.cloudword .v{display:block;font-size:.42em;font-weight:800;opacity:.72;margin-top:3px;letter-spacing:.03em}
.cloudword.lead{font-weight:800;text-shadow:0 0 28px currentColor,0 0 10px currentColor}
.cloudword.hot{text-shadow:0 0 16px currentColor}
.cloudword.pump{animation:pump .75s cubic-bezier(.22,1,.36,1)}
@keyframes pump{0%{transform:scale(1)}28%{transform:scale(1.28)}100%{transform:scale(1)}}
.kpi b.flash{animation:kflash .9s ease}
@keyframes kflash{0%{color:var(--green);transform:scale(1.35)}100%{color:inherit;transform:scale(1)}}
.ticker.newidea{animation:tflash 1.1s ease}
@keyframes tflash{0%{background:rgba(144,195,58,.28)}100%{background:transparent}}
.maplegend{position:absolute;left:4px;right:4px;bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 34px;font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--stage-muted);border-top:1px solid var(--stage-line);padding-top:10px}
.maplegend .lg{display:inline-flex;align-items:center;gap:7px}.maplegend .lg i{width:9px;height:9px;border-radius:50%;flex:none}
.maplegend .hint{margin-left:auto;opacity:.75}
.side{display:flex;flex-direction:column;min-height:0}
.side h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-muted);margin-bottom:12px}
.rrow{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;margin-bottom:9px}
.rrow .nm{font-family:var(--display);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.rrow .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.rrow .n{font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.rrow .b{grid-column:1/-1;height:7px;background:var(--stage-line);border-radius:4px;overflow:hidden}
.rrow .b i{display:block;height:100%;border-radius:4px;transition:width .6s}
.toptxt{margin-top:16px;border-top:1px solid var(--stage-line);padding-top:14px}
.sr{font-size:13px;line-height:1.25;margin-bottom:8px;display:flex;gap:8px}.sr b{font-family:var(--mono);color:var(--accent);flex:none}
.empty{color:var(--stage-muted);font-size:14px;margin-top:40px;text-align:center}
@media (min-width:821px) and (max-width:1150px){.top h1{font-size:25px}.brandlogo{height:38px;margin-right:16px}.kpi{gap:26px;padding-left:12px}.kpi div{font-size:10px}.kpi b{font-size:28px}.live{font-size:11px}}
@media (max-width:820px){html,body{overflow-y:auto;overflow-x:hidden;height:auto;-webkit-overflow-scrolling:touch}.stage{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;overflow:visible;height:auto;min-height:100vh;min-height:100dvh;padding-bottom:28px}.kpi{margin-left:0;gap:18px}.mapwrap{min-height:52vh}.cloud{position:static;top:auto;right:auto;bottom:auto;left:auto;height:auto;overflow:visible;display:flex;flex-direction:column;align-items:center;gap:1px;padding:16px 10px}.cloudword{position:static!important;transform:none!important;left:auto!important;top:auto!important;max-width:90%}.maplegend{position:static;margin-top:14px}}
.brandlogo{height:46px;width:auto;flex:none;margin-right:26px}
</style>
</head>

<script>
const $=(id)=>document.getElementById(id);
const cloud=$('cloud'); let coloring={}; let legendDone=false;
let bubbles={}; // id -> {el, votos}
// Paleta dos AROS OLÍMPICOS adaptada ao fundo escuro (o anel preto, invisível no
// fundo, vira azul-celeste; as 2 teses extras recebem tons harmônicos).
const OLY={fas:'#2E9BE0',midia:'#2FBF57',perf:'#FCB131',prod:'#F0485F',gestao:'#28C4E6',sust:'#17B6A0',arenas:'#9B6CF0'};
// Centro do telão: as FRASES (ideias) escritas pelos participantes, girando a cada 5s.
// Layout em fluxo (flexbox) — robusto em qualquer navegador de TV, sem medição 2D.
let IDEIAS=[]; let ideaPage=0;
function escTxt(s){return (''+s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function renderIdeias(){
  const pool=IDEIAS;
  $('cloudEmpty').style.display=pool.length?'none':'block';
  if(!pool.length){cloud.className='cloud';cloud.innerHTML='';return;}
  const mobile=window.innerWidth<=820;
  const per=Math.min(mobile?5:8,pool.length);
  const pages=Math.max(1,Math.ceil(pool.length/per));
  const start=(ideaPage%pages)*per;
  let slice=pool.slice(start,start+per);
  if(slice.length<per&&pool.length>per)slice=slice.concat(pool.slice(0,per-slice.length));
  const sizes=mobile?[26,20,23,19,22]:[48,34,42,30,40,32,44,28];
  cloud.className='cloud flow';
  cloud.innerHTML=slice.map((it,i)=>{
    const col=OLY[it.tese_slug]||'#9fd0ff';
    const num=it.numero?('<i class="n">#'+escTxt(it.numero)+'</i>'):'';
    return '<span class="ideaword" style="color:'+col+';font-size:'+sizes[i%sizes.length]+'px">'+escTxt(it.frase)+num+'</span>';
  }).join('');
}
function rotateIdeias(){if(IDEIAS.length<1)return;ideaPage++;cloud.style.opacity='0';setTimeout(()=>{renderIdeias();cloud.style.opacity='1';},350);}
// As mais votadas ficam grandes e vivas no CENTRO; as menos votadas, menores e
// mais discretas, espalhadas para as LATERAIS. No telão (desktop) é um
// espalhamento 2D; no celular vira uma coluna que rola (sem caixas, sem corte).
// Varredura final: mede a caixa REAL ja renderizada e, se duas ainda se
// tocarem, oculta a de menor prioridade. Garante que nunca haja sobreposicao,
// independentemente de variacoes de medicao/reflow durante o posicionamento.
// Varredura de garantia: usa a posicao-ALVO (style.left/top + offsetWidth),
// que e estavel no mesmo instante (nao ha transicao de posicao). Se duas
// palavras ainda se tocarem, oculta a de menor prioridade. Assim nunca ha
// sobreposicao, mesmo com variacoes de medicao no posicionamento.
function cloudBox(b){
  return{x:parseFloat(b.el.style.left),y:parseFloat(b.el.style.top),w:b.el.offsetWidth,h:b.el.offsetHeight};
}
function cloudSweep(order){let changed=true,guard=0;
  while(changed&&guard++<40){changed=false;
    const vis=order.filter(b=>b._vis&&b.el.style.opacity!=='0');
    const bx=vis.map(b=>({b,box:cloudBox(b)}));
    for(let i=0;i<bx.length&&!changed;i++)for(let j=i+1;j<bx.length;j++){const A=bx[i].box,B=bx[j].box;
      if(Math.abs(A.x-B.x)<(A.w+B.w)/2+6&&Math.abs(A.y-B.y)<(A.h+B.h)/2+4){
        bx[j].b._vis=false;bx[j].b.el.style.opacity='0';changed=true;break;}}}
}
function renderCloud(sol){
  const W=cloud.clientWidth,H=cloud.clientHeight; if(!W)return;
  const mobile=window.innerWidth<=820;
  const LIMIT=mobile?14:12;
  const items=sol.slice(0,LIMIT); const n=items.length; const keep=new Set(items.map(s=>String(s.id)));
  Object.keys(bubbles).forEach(k=>{if(!keep.has(k)){bubbles[k].el.remove();delete bubbles[k];}});
  $('cloudEmpty').style.display=items.length?'none':'block';
  if(!items.length)return;
  const max=items[0].votos,min=items[items.length-1].votos;
  const maxFs=mobile?Math.max(20,Math.min(40,Math.round(W/9))):Math.max(26,Math.min(52,Math.round(W/12)));
  const minFs=Math.max(15,Math.round(maxFs*(mobile?0.5:0.42)));
  items.forEach((s,idx)=>{let b=bubbles[s.id];if(!b){const el=document.createElement('span');el.className='cloudword';el.style.left='50%';el.style.top='50%';el.style.opacity='0';cloud.appendChild(el);b={el,votos:-1};bubbles[s.id]=b;}
    const badge=(idx<10&&s.votos>0)?(' <i class="v">'+s.votos+'×</i>'):'';
    b.el.innerHTML=(''+s.texto).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+badge;
    b.el.style.color=OLY[s.slug]||s.cor;b.el.title=s.texto+' — '+s.votos+' votos';
    const tv=max>min?(s.votos-min)/(max-min):1, tr=n>1?1-idx/(n-1):1, t=0.5*tv+0.5*tr;
    b.baseFs=minFs+Math.round(Math.pow(t,1.25)*(maxFs-minFs));
    b.el.dataset.op=(1-(n>1?idx/(n-1):0)*0.45).toFixed(2);
    b.el.classList.toggle('lead',idx===0);
    b.el.classList.toggle('hot',idx>0&&idx<3);
    if(b.votos>=0&&s.votos>b.votos){b.el.classList.remove('pump');void b.el.offsetWidth;b.el.classList.add('pump');}
    b.votos=s.votos;});
  // Em celular, OU quando a area 2D nao pode ser medida de forma confiavel
  // (navegador antigo de TV / area central colapsada), as frases sao empilhadas
  // em fluxo simples — sem posicionamento absoluto nem medicao palavra a palavra.
  if(mobile || !H || H < 140){
    cloud.style.position='relative';cloud.style.height='auto';cloud.style.overflow='visible';
    cloud.style.display='flex';cloud.style.flexWrap='wrap';cloud.style.flexDirection=mobile?'column':'row';
    cloud.style.alignItems='center';cloud.style.alignContent='center';cloud.style.justifyContent='center';cloud.style.gap='2px 18px';
    items.forEach(s=>{const b=bubbles[s.id];b._vis=true;const e=b.el;e.style.position='static';e.style.transform='none';e.style.left='auto';e.style.top='auto';e.style.fontSize=b.baseFs+'px';cloud.appendChild(e);e.style.opacity=b.el.dataset.op;});
    return;
  }
  // Espalhamento 2D (telao). Reseta estilos que o modo fluxo possa ter deixado.
  cloud.style.position='';cloud.style.height='';cloud.style.overflow='';cloud.style.display='';cloud.style.flexWrap='';cloud.style.flexDirection='';cloud.style.alignItems='';cloud.style.alignContent='';cloud.style.justifyContent='';cloud.style.gap='';
  const placed=[],cx=W/2,cy=H*0.47,order=items.map(s=>bubbles[s.id]);
  order.forEach(b=>{b.el.style.position='';b.el.style.transform='';const el=b.el;let fs=b.baseFs,ok=false,x=cx,y=cy,w,h;
    for(let shrink=0;shrink<12&&!ok;shrink++){
      el.style.fontSize=fs+'px';w=el.offsetWidth;h=el.offsetHeight;
      for(let t=0;t<9000;t++){const a=t*0.22,r=t*0.5;x=cx+Math.cos(a)*r*1.45;y=cy+Math.sin(a)*r;
        if(x-w/2<6||x+w/2>W-6||y-h/2<6||y+h/2>H-24)continue;
        if(!placed.some(p=>Math.abs(p.x-x)<(p.w+w)/2+20&&Math.abs(p.y-y)<(p.h+h)/2+16)){ok=true;break;}}
      if(!ok)fs=Math.max(14,Math.round(fs*0.86));}
    b._vis=ok;
    if(ok){placed.push({x,y,w,h});el.style.fontSize=fs+'px';el.style.left=x+'px';el.style.top=y+'px';el.style.opacity=el.dataset.op;}else{el.style.opacity='0';}});
  cloudSweep(order); // garante zero sobreposicao nas posicoes-alvo
}
let prev={part:null,ideias:null,sol:null,frase:null};
function setKpi(id,val,key){const el=$(id);if(prev[key]!==null&&val>prev[key]){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}el.textContent=val;prev[key]=val;}
function draw(d){
  if(d.event&&d.event.subtitulo)$('subt').textContent=d.event.subtitulo.replace(/^o futuro do esporte /i,'');
  if(!legendDone && d.porTese){$('mapLeg').innerHTML=d.porTese.map(t=>'<span class="lg"><i style="background:'+(OLY[t.slug]||t.cor)+'"></i>'+t.nome+'</span>').join('')+'<span class="hint">quanto mais votos, maior a solução</span>';legendDone=true;}
  const max=Math.max(1,...d.porTese.map(t=>t.n));
  $('rankRows').innerHTML=d.porTese.map(t=>{const c=OLY[t.slug]||t.cor;return '<div class="rrow"><div class="nm"><i style="background:'+c+'"></i>'+t.nome+'</div><div class="n">'+t.n+'</div><div class="b"><i style="width:'+(t.n/max*100)+'%;background:'+c+'"></i></div></div>';}).join('');
  $('topSols').innerHTML=(d.solucoes.slice(0,5).map(s=>'<div class="sr"><b>'+s.votos+'×</b><span>'+s.texto+'</span></div>').join(''))||'<div class="sr">sem votos ainda</div>';
  if(d.recentes&&d.recentes[0]){const f=d.recentes[0].frase;$('tkTxt').textContent=f;$('tkWho').textContent=d.recentes[0].numero?('INSCRIÇÃO '+d.recentes[0].numero):'';
    if(prev.frase!==null&&f!==prev.frase){const tk=document.querySelector('.ticker');if(tk){tk.classList.remove('newidea');void tk.offsetWidth;tk.classList.add('newidea');}}prev.frase=f;}
  IDEIAS=(d.recentes||[]);
  if(!cloud.children.length)renderIdeias();
}
let polling=false;
async function tick(){if(polling)return;polling=true;try{const r=await fetch('/api/telao',{cache:'no-store'});const d=await r.json();draw(d);}catch(e){}finally{polling=false;}}
window.addEventListener('resize',()=>{});
tick(); setInterval(tick,1500); setInterval(rotateIdeias,5000);
</script>
